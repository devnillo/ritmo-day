# Verifica o código e publica as imagens Docker no GitHub Container Registry.
# A VPS não constrói nada: o scripts/deploy.sh só baixa as imagens prontas (ver docs/DEPLOY.md).
name: CI e imagens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  images:
    name: Imagem ${{ matrix.service }}
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: web
            target: runner
          - service: migrate
            target: migrate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Opcional: só roda depois de configurar a variável VPS_HOST no repositório (docs/DEPLOY.md).
  deploy:
    name: Deploy na VPS
    needs: images
    if: github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: cd "${{ vars.VPS_APP_DIR }}" && ./scripts/deploy.sh
